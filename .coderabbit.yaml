# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Inherit the shared CodeRabbit settings.
# Keep only Bastion for Apple overrides here.
inheritance: true

reviews:
  path_instructions:
    # SSH trust and authentication.
    - path: "Sources/SSHCore/{HostKeyValidator,KnownHosts,SSHUserAuth,SSHSession}.swift"
      instructions: |
        When host key verification or authentication changes, check
        that TOFU still distinguishes the first connection from a changed
        key for the same host and port. A changed key must be rejected.
        Also check separate commands, SFTP and every ProxyJump hop
        where those connection paths exist.
        When agent forwarding changes, check that the user's
        explicit forwardAgent choice still controls access.
        UI code must not bypass SSHCore checks.

    # Concurrency and connection lifetime.
    - path: "{Sources/SSHCore/{SSHSession,SSHShell,SFTPClient}.swift,App/{ChainConnector,TerminalView}.swift,App/TVApp/ChainConnector.swift}"
      instructions: |
        When connect, keepalive or close changes, trace concurrent
        connect, channel-open and close sequences and auth failures.
        Check that promises and continuations complete at most
        once and that errors or close never leave calls pending.
        Check that late connections and channels are closed
        if the caller has already cancelled.
        An old keepalive monitor must not close a new session.
        Use TerminalTeardownRaceTests, AuthFailureTerminationTests and the
        app and tvOS session tests (ChainConnector) as regression evidence.

    # Persistent format and merging.
    - path: "{Sources/SSHCore/{Host,HostStore,Snippet,SnippetStore,SyncEngine}.swift,Tests/fixtures/{host-wire-format,sync-state-wire-format}.json}"
      instructions: |
        When serialization or storage changes, compare field names,
        UUID encoding, the 2001-01-01 date epoch and the tombstone format
        with existing readers and the wire-format fixtures.
        Check reading of older Host lists and, where snippets
        are included, state without the snippets field.
        Check that merge is idempotent and order independent,
        also with equal modifiedAt. A tombstone at least as new must
        win over the entry. Shared tombstones must not be dropped
        when hosts and snippets are stored in separate files.
        Check that changed write paths keep the complete previous
        data on failure and do not lose concurrent local changes.
        Do not assume identical feature support across platforms.
        Never change fixtures just to hide a format break.
        Apple owns the shared sync format. Follow docs/sync-format.md:
        intentional format changes update models and fixtures together,
        identify the format change in the PR and require follow-up issues
        in affected platform repositories.

    # Encrypted sync format.
    - path: "Sources/SSHCore/SyncCrypto.swift"
      instructions: |
        When the envelope or the cryptography changes, check BSYNC1,
        the big-endian encoding of the iteration field, salt and the order
        nonce, ciphertext, tag against the other implementations.
        Check PBKDF2-HMAC-SHA256, AES-256-GCM, a fresh salt
        and a fresh nonce, and rejection of tampered envelopes.
        The input iteration count must be bounded before key derivation.
        Check compatibility with existing encrypted files
        and known test vectors. A wrong passphrase or corrupt data must
        never be read as an empty state that is then written back.

    # OAuth and cloud sync.
    - path: "{App/{OAuthAccountManager,OAuthTokenStore,OAuthProviders,DropboxSyncProvider,GoogleDriveSyncProvider,OneDriveSyncProvider}.swift,App/TVApp/{TVDeviceFlowOAuthManager,TVOAuthTokenStore,GoogleDriveSyncProvider,OneDriveSyncProvider}.swift}"
      instructions: |
        When the OAuth flow changes, check the link between PKCE,
        state, the callback and the redirect_uri used in the code exchange.
        On token refresh, check concurrent calls for the same
        provider and that a rotated refresh token is stored without
        another refresh writing back an older value.
        If the response has no refresh token, keep the previous one.
        In the tvOS device flow, cancellation and expiry must stop polling
        and token storage. Respect interval and slow_down.
        When sync transport changes, separate a missing file from denied access,
        network errors and a corrupt payload before any push.
        Keep SyncCrypto encryption in the Apple cloud providers.
        Check that error messages never expose tokens or raw
        response bodies that may contain credentials.

    # SFTP protocol and file handles.
    - path: "Sources/SSHCore/SFTP{Client,Protocol}.swift"
      instructions: |
        When SFTP decoding changes, check fragmented packets,
        untrusted length fields and entry counts before allocation.
        When request handling changes, check that every response
        matches the right request id, also with concurrent operations.
        Protocol errors and a closed channel must end pending calls.
        Check that opened file and directory handles are closed
        even when read, write or decode fails.
        Close file and directory handles on cancellation too.

    # TCP and SOCKS forwarding.
    - path: "Sources/SSHCore/{PortForward,SOCKSProxy}.swift"
      instructions: |
        When binding changes, check that local and dynamic
        forwards are not accidentally exposed beyond loopback.
        Separate the local bind from the intended remote bind address.
        With remote port 0, the assigned port must be used for registration
        and deregistration. Reject incoming forwarded-tcpip
        that does not match an active forward.
        Check that listeners and active bridges close on error
        or exit, and that SOCKS replies match the connection result.

    # Command builders for remote systems.
    - path: "Sources/SSHCore/{ArchiveOperations,KeyManagement,DockerService,ProcessRunner}.swift"
      instructions: |
        When file names, keys or Docker references reach a command,
        check correct quoting for the actual shell and protection
        against both shell injection and flag injection.
        Separate container names from image references with a registry,
        tag or digest. Validation must not confuse the formats.
        On key deploy, existing authorized_keys must be kept.
        Check idempotence and verification with the new key.
        When the process runner changes, check concurrent draining
        of stdout and stderr so full pipe buffers never block the process.

    # Fetching executable tools.
    - path: "Sources/SSHCore/ExternalBinaryFetcher.swift"
      instructions: |
        When fetching or caching changes, check that both downloaded
        and reused bytes are verified against the expected SHA256 before
        they are handed out as a valid executable.
        For archive downloads, separate the archive checksum from the
        checksum of the extracted binary.
        Check the selected OS, architecture and archive member, and that
        untrusted names cannot write outside the cache directory.
        A bad cache entry must never run as a fallback on network errors.

    # S3-compatible services.
    - path: "Sources/SSHCore/S3Client.swift"
      instructions: |
        When SigV4 or URL building changes, compare the canonical request
        with the URL, Host header, query string and payload that are sent.
        Check non-standard ports, special characters in object keys,
        sorted query parameters and existing path-style support.
        Check signature vectors and that HTTP errors are never reported
        as successful object operations.

    # Apple project dependency and target boundaries.
    - path: "{Package.swift,App/{Package.swift,project.yml,project.dependencies.yml,generate-project.sh}}"
      instructions: |
        When dependencies change, update the manifest that owns them:
        root Package.swift owns SSHCore and bastion-cli;
        App/Package.swift owns app dependencies.
        For SwiftTerm, check App/Package.swift, SWIFTTERM_VERSION,
        project.dependencies.yml and generate-project.sh together.
        Generate projects through App/generate-project.sh, not xcodegen directly.
        App/Package.swift must remain excluded from app source.
        tvOS must not acquire SwiftTerm or unavailable iOS/macOS APIs.
        Apps must continue to use SSHCore from the root package.
        Do not add signing credentials, certificates or provisioning profiles.

    # Apple UI and platform availability.
    - path: "App/**/*.swift"
      instructions: |
        When shared UI code changes, check API availability and conditional
        compilation for every target that includes the file.
        Keep iOS/macOS terminal integration separate from tvOS.
        UI changes must not bypass SSHCore authentication or host key checks.
        Check actor isolation when asynchronous work updates UI state.
        Check cancellation and resource cleanup when views or sessions close.

    # Credential storage.
    - path: "App/{Keychain,OAuthTokenStore,TVApp/Keychain,TVApp/TVOAuthTokenStore}.swift"
      instructions: |
        When credential persistence changes, check Keychain error handling
        and account/service isolation before reporting success.
        Preserve existing credentials when replacement storage fails.
        Do not move keys, passwords or tokens into ordinary files,
        preferences, logs or test fixtures.

    # Verification evidence.
    - path: "{Sources/**/*.swift,Tests/**,App/**,Package.swift}"
      instructions: |
        For changes affecting Swift behavior or builds, distinguish package
        verification from Apple app verification.
        The root package can be built and tested on Linux or macOS.
        Apple apps require Xcode on macOS.
        Follow AGENTS.md and docs/operations.md for applicable checks.
        Do not claim CI tested the Swift code without evidence.
        If an affected app target could not be built or tested, require
        that limitation to be stated in the PR.

    # Publishing releases.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        When release decisions or the check gate change, check
        that the tag, the checks and the publication refer to the same target_sha.
        Missing, pending or failed required checks must never
        count as passed. Check pagination and the latest
        result per check and issuer on reruns.
        On concurrent releases or retries, check that an
        existing tag's target is verified and that the same release is not
        published again with different content.
        Check stable versions, rc and promote against the parser
        and existing release anchors without bypassing the check gate.
        Workflows remain owner-managed; do not propose agent workflow edits.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
    - '**/AGENTS.md'
    - pissmyran/.github:GOVERNANCE.md
    - pissmyran/.github:BASTION.md
    - files: docs/architecture.md
      applyTo: Sources/**,App/**,Package.swift
    - files: docs/operations.md
      applyTo: Sources/**,Tests/**,App/**,Package.swift
    - files: docs/sync-format.md
      applyTo: Sources/SSHCore/**,Tests/fixtures/**
  linked_repositories:
  - repository: pissmyran/bastion
    instructions: |
      Bastion hub and shared documentation.
      Check user-facing documentation affected by Apple behavior changes.
  - repository: pissmyran/bastion_linux
    instructions: |
      Linux client and consumer of Apple's sync format.
      Compare affected readers and fixture copies for compatibility.
      Do not assume identical platform features.
  - repository: pissmyran/bastion_windows
    instructions: |
      Windows client and consumer of Apple's sync format.
      Compare affected readers and fixture copies for compatibility.
      Do not assume identical platform features.
  - repository: pissmyran/bastion_android
    instructions: |
      Android client in the Bastion platform family.
      Check affected sync interoperability where implemented.
      Do not assume identical platform features.
