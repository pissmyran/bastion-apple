[project]
site_name = "Bastion for Apple"
site_url = "https://pissmyran.github.io/bastion_apple/"
site_description = "The SSH client for iPhone, iPad, Mac and Apple TV, built on the shared Swift core SSHCore."
repo_url = "https://github.com/pissmyran/bastion_apple"
repo_name = "pissmyran/bastion_apple"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Bastion – Apache-2.0"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Operations" = "operations.md" },
  { "Sync format" = "sync-format.md" },
  { "Releases" = "release.md" },
  { "GUI prototype" = "prototype/bastion-gui.html" },
]
extra_css = [
  "stylesheets/extra.css",
]

[project.extra]
platform = "iOS, iPadOS, macOS and tvOS"
tagline = "The SSH client for iPhone, iPad, Mac and Apple TV, built on the shared Swift core SSHCore."

[project.theme]
variant = "modern"
language = "en"
custom_dir = "overrides"
logo = "assets/bastion.svg"
favicon = "assets/bastion.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Follow the system theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to the system theme"
